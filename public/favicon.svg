<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ExpenseSnap">
  <defs>
    <linearGradient id="wallet" x1="8" y1="10" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .frame { stroke: #0f172a; }
      .clasp { fill: #0f172a; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1a1b22; }
        .frame { stroke: #cbd5e1; }
        .clasp { fill: #e2e8f0; }
      }
    </style>
  </defs>
  <rect class="bg" width="32" height="32" rx="7"/>
  <!-- Viewfinder corners (brand frame) -->
  <path class="frame" fill="none" stroke-width="2.25" stroke-linecap="round" d="M5.5 11V5.5H11"/>
  <path class="frame" fill="none" stroke-width="2.25" stroke-linecap="round" d="M26.5 11V5.5H21"/>
  <path class="frame" fill="none" stroke-width="2.25" stroke-linecap="round" d="M5.5 21v5.5H11"/>
  <path class="frame" fill="none" stroke-width="2.25" stroke-linecap="round" d="M26.5 21v5.5H21"/>
  <!-- Bills -->
  <rect x="10.5" y="8" width="7.5" height="6.5" rx="1.25" fill="#5eead4"/>
  <rect x="13.5" y="6" width="7.5" height="6.5" rx="1.25" fill="#2dd4bf"/>
  <path fill="none" stroke="#0f172a" stroke-width="1.1" stroke-linecap="round" d="M16.5 8.8v3.4M15.2 9.6h2.2c.6 0 1 .4 1 1s-.4 1-1 1h-2.2"/>
  <!-- Wallet body -->
  <rect x="8.5" y="13.5" width="15" height="10.5" rx="3" fill="url(#wallet)"/>
  <rect x="17.5" y="13.5" width="6" height="10.5" rx="2.5" fill="#0d9488"/>
  <circle class="clasp" cx="20.2" cy="18.8" r="1.65"/>
